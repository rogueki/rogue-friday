openapi: 3.1.1
info:
  title: JARVIS Control API
  version: 1.0.0
  summary: Contract of the Jarvis Command Center control API
  description: Single source of truth for all REST interactions between the dashboard and the Jarvis Control API. The dashboard never talks to adapters or backing systems directly. Real-time events are described in the AsyncAPI document (`asyncapi/jarvis-events.yaml`). Models live in `schemas/` (JSON Schema 2020-12). Breaking changes require a major version bump.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:3100
    description: Local control API (default)
tags:
  - name: meta
    description: Meta, capabilities and adapter health
  - name: overview
    description: Aggregated home data and overall status
  - name: orb
    description: Semantic orb state
  - name: auth
    description: Session, CSRF and re-authentication
  - name: tasks
    description: Tasks and Kanban
  - name: activity
    description: Live activity and event backfill
  - name: memory
    description: Memory
  - name: agents
    description: Agents
  - name: approvals
    description: Human approvals
  - name: communication
    description: Unified inbox, drafts
  - name: calendar
    description: Calendar, conflicts, briefings, proposals
  - name: automations
    description: Automations and run history
  - name: research
    description: Research projects
  - name: files
    description: Files and documents
  - name: voice
    description: Voice pipeline
  - name: notifications
    description: Notifications and alerts
  - name: system
    description: Hardware, services, models
  - name: audit
    description: Audit trail
  - name: settings
    description: Settings, themes, layouts, adapter configuration
  - name: commands
    description: Global command bar
  - name: dev
    description: Development/QA scenario console (mock mode only)
security:
  - cookieAuth: []
paths:
  /api/v1/meta:
    get:
      operationId: getMeta
      tags:
        - meta
      summary: Bootstrap information (contract version, data mode, event stream location)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - meta
      summary: Liveness and component health of the control API
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags:
        - meta
      summary: Capability discovery for all modules
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/adapters:
    get:
      operationId: listAdapters
      tags:
        - meta
      summary: List registered adapters with manifest and health
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterInfoListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: system.read
      x-required-role: viewer
  /api/v1/adapters/{id}/health:
    get:
      operationId: getAdapterHealth
      tags:
        - meta
      summary: Health of one adapter
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterHealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: system.read
      x-required-role: viewer
  /api/v1/overview:
    get:
      operationId: getOverview
      tags:
        - overview
      summary: Aggregated home payload
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/status:
    get:
      operationId: getStatus
      tags:
        - overview
      summary: Compact overall Jarvis status
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JarvisStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/orb/status:
    get:
      operationId: getOrbStatus
      tags:
        - orb
      summary: Current semantic orb state with parallel layers
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrbSnapshotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Sign in and receive the session cookie
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Set-Cookie:
              description: HttpOnly, SameSite=Strict session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-required-role: none
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: End the current session
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-role: viewer
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
        - auth
      summary: End all sessions of the current user
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-role: viewer
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags:
        - auth
      summary: Current session, role and CSRF token
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-required-role: viewer
  /api/v1/auth/reauth:
    post:
      operationId: reauth
      tags:
        - auth
      summary: Re-authenticate for Tier-3 actions and receive a short-lived token
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-role: operator
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags:
        - tasks
      summary: List tasks
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          required: false
          description: Filter by priority
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Priority"
        - name: agentId
          in: query
          required: false
          description: Filter by assigned agent
          schema:
            type: string
        - name: label
          in: query
          required: false
          description: Filter by label
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Full-text query
          schema:
            type: string
        - name: dueBefore
          in: query
          required: false
          description: Only tasks due before this instant
          schema:
            type: string
            format: date-time
        - name: updatedSince
          in: query
          required: false
          description: Only tasks updated after this instant
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - -updatedAt
              - updatedAt
              - priority
              - dueAt
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.read
      x-required-role: viewer
    post:
      operationId: createTask
      tags:
        - tasks
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Created
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.create
      x-required-role: operator
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags:
        - tasks
      summary: Get a task with steps, tool calls and artifacts
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.read
      x-required-role: viewer
    patch:
      operationId: updateTask
      tags:
        - tasks
      summary: Update a task (also used for Kanban moves)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.update
      x-required-role: operator
  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags:
        - tasks
      summary: Cancel a task
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.cancel
      x-required-role: operator
  /api/v1/tasks/{id}/retry:
    post:
      operationId: retryTask
      tags:
        - tasks
      summary: Retry a task
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.retry
      x-required-role: operator
  /api/v1/tasks/{id}/pause:
    post:
      operationId: pauseTask
      tags:
        - tasks
      summary: Pause a task
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.pause
      x-required-role: operator
  /api/v1/tasks/{id}/resume:
    post:
      operationId: resumeTask
      tags:
        - tasks
      summary: Resume a task
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":

    action: receive
    title: Client sends control frames
    description: Clients answer pings and may ping to measure roundtrip time.
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/ping"
      - $ref: "#/channels/events/messages/pong"

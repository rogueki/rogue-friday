asyncapi: 3.1.0
info:
  title: FRIDAY Realtime Events
  version: 2.0.0
  description: "WebSocket event stream of the Friday Control API. Every event is a CloudEvents-inspired envelope with a global, strictly increasing `sequence`. Reconnect with `?since=<last sequence>`; if the sequence is no longer buffered the server sends `friday.status.resync_required` and the client reloads snapshots. Heartbeat: ping/pong control frames (not envelopes)."
defaultContentType: application/json
servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local control API (same origin as the REST API; eventsOrigin in /meta may override).
channels:
  events:
    address: /api/v1/events
    title: Event stream
    description: "Single multiplexed event stream. Event groups: status, orb, task, activity, memory, agent, approval, communication, calendar, automation, research, file, voice, notification, system, audit, adapter."
    bindings:
      ws:
        method: GET
        query:
          type: object
          properties:
            since:
              type: integer
              minimum: 0
              description: Replay events with a greater sequence.
          additionalProperties: false
        bindingVersion: 0.1.0
    messages:
      statusChanged:
        $ref: "#/components/messages/statusChanged"
      statusResyncRequired:
        $ref: "#/components/messages/statusResyncRequired"
      orbStatusChanged:
        $ref: "#/components/messages/orbStatusChanged"
      taskCreated:
        $ref: "#/components/messages/taskCreated"
      taskUpdated:
        $ref: "#/components/messages/taskUpdated"
      taskProgress:
        $ref: "#/components/messages/taskProgress"
      taskCompleted:
        $ref: "#/components/messages/taskCompleted"
      taskFailed:
        $ref: "#/components/messages/taskFailed"
      taskCancelled:
        $ref: "#/components/messages/taskCancelled"
      activityAppended:
        $ref: "#/components/messages/activityAppended"
      memoryCreated:
        $ref: "#/components/messages/memoryCreated"
      memoryUpdated:
        $ref: "#/components/messages/memoryUpdated"
      memoryDeleted:
        $ref: "#/components/messages/memoryDeleted"
      agentStatusChanged:

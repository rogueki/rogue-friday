components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: friday_session
      description: HttpOnly, SameSite=Strict session cookie. Mutating requests additionally need X-CSRF-Token.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from pageInfo.nextCursor
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PathId:
      name: id
      in: path
      required: true
      description: Opaque resource id (prefix identifies the type)
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Resource version for optimistic concurrency; a mismatch yields 409 CONFLICT. Set by the SDK callers.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeated keys replay the stored response instead of executing again.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Generated by the server when absent; echoed in the response.
      schema:
        type: string
    ApprovalToken:
      name: X-Approval-Token
      in: header
      required: false
      description: Short-lived, single-use approval token from GET /approvals/{id} (response header X-Approval-Token). The server rejects an approve without a valid token with 403 APPROVAL_REQUIRED (PLAN Â§32.5).
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: CSRF double-submit token from GET /auth/session. Added automatically by the SDK on mutating requests.
      schema:
        type: string
  headers:
    CorrelationId:
      description: Correlation id of this request
      schema:
        type: string
    IdempotentReplayed:
      description: Set to "true" when the response was replayed from the idempotency store for a repeated Idempotency-Key instead of executing the operation again.
      schema:
        type: string
        enum:
          - "true"
    ApprovalToken:
      description: Short-lived, single-use token bound to this approval, user and the approve action; send it back as X-Approval-Token on POST /approvals/{id}/approve. Only present for pending approvals the caller may decide.
      schema:
        type: string
    ApprovalTokenExpires:
      description: Expiry of X-Approval-Token (UTC ISO-8601).
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not authenticated (UNAUTHENTICATED, REAUTH_REQUIRED)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Not allowed (FORBIDDEN, CSRF_INVALID, CAPABILITY_MISSING, APPROVAL_REQUIRED)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (NOT_FOUND)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Version conflict or idempotency key reuse (CONFLICT, IDEMPOTENCY_CONFLICT)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation failed (VALIDATION_FAILED)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeds the size limit of the operation (VALIDATION_FAILED)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limited (RATE_LIMITED)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Adapter unavailable or timed out (ADAPTER_UNAVAILABLE, ADAPTER_TIMEOUT, INTERNAL)
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ActionResult:
      $ref: ../schemas/common/action-result.schema.json
    ActivityEvent:
      $ref: ../schemas/activity/activity-event.schema.json
    ActivityEventListResponse:
      $ref: ../schemas/activity/activity-event-list-response.schema.json

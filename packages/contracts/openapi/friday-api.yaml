openapi: 3.1.1
info:
  title: FRIDAY Control API
  version: 2.0.0
  summary: Contract of the Friday Command Center control API
  description: Single source of truth for all REST interactions between the dashboard and the Friday Control API. The dashboard never talks to adapters or backing systems directly. Real-time events are described in the AsyncAPI document (`asyncapi/friday-events.yaml`). Models live in `schemas/` (JSON Schema 2020-12). Breaking changes require a major version bump.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:3100
    description: Local control API (default)
tags:
  - name: meta
    description: Meta, capabilities and adapter health
  - name: overview
    description: Aggregated home data and overall status
  - name: orb
    description: Semantic orb state
  - name: auth
    description: Session, CSRF and re-authentication
  - name: tasks
    description: Tasks and Kanban
  - name: activity
    description: Live activity and event backfill
  - name: memory
    description: Memory
  - name: agents
    description: Agents
  - name: approvals
    description: Human approvals
  - name: communication
    description: Unified inbox, drafts
  - name: calendar
    description: Calendar, conflicts, briefings, proposals
  - name: automations
    description: Automations and run history
  - name: research
    description: Research projects
  - name: files
    description: Files and documents
  - name: voice
    description: Voice pipeline
  - name: notifications
    description: Notifications and alerts
  - name: system
    description: Hardware, services, models
  - name: audit
    description: Audit trail
  - name: settings
    description: Settings, themes, layouts, adapter configuration
  - name: skills
    description: Packaged skill catalog, observed Hermes state and owner onboarding
  - name: commands
    description: Global command bar
  - name: dev
    description: Development/QA scenario console (mock mode only)
  - name: observability
    description: Prometheus metrics and frontend telemetry (PLAN Â§50.3)
security:
  - cookieAuth: []
paths:
  /api/v1/meta:
    get:
      operationId: getMeta
      tags:
        - meta
      summary: Bootstrap information (contract version, data mode, event stream location)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - meta
      summary: Liveness and component health of the control API
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags:
        - meta
      summary: Capability discovery for all modules
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/adapters:
    get:
      operationId: listAdapters
      tags:
        - meta
      summary: List registered adapters with manifest and health
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterInfoListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: system.read
      x-required-role: viewer
  /api/v1/adapters/{id}/health:
    get:
      operationId: getAdapterHealth
      tags:
        - meta
      summary: Health of one adapter
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterHealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: system.read
      x-required-role: viewer
  /api/v1/adapters/{id}/restart:
    post:
      operationId: restartAdapter
      tags:
        - meta
      summary: Restart one adapter (owner, audited; shutdown, new instance, initialize)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: system.restartAdapter
      x-required-role: owner
  /api/v1/adapters/{id}/logs:
    get:
      operationId: getAdapterLogs
      tags:
        - meta
      summary: Recent redacted log lines of one adapter from the Control API log buffer
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: limit
          in: query
          required: false
          description: Maximum number of lines (newest kept)
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: level
          in: query
          required: false
          description: Minimum level
          schema:
            type: string
            enum:
              - debug
              - info
              - warn
              - error
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterLogListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: system.openLogs
      x-required-role: owner
  /api/v1/overview:
    get:
      operationId: getOverview
      tags:
        - overview
      summary: Aggregated home payload
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/status:
    get:
      operationId: getStatus
      tags:
        - overview
      summary: Compact overall Friday status
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FridayStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/orb/status:
    get:
      operationId: getOrbStatus
      tags:
        - orb
      summary: Current semantic orb state with parallel layers
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrbSnapshotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.read
      x-required-role: viewer
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Sign in and receive the session cookie
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Set-Cookie:
              description: HttpOnly, SameSite=Strict session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-required-role: none
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: End the current session
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-role: viewer
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
        - auth
      summary: End all sessions of the current user
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-role: viewer
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags:
        - auth
      summary: Current session, role and CSRF token
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
      x-required-role: viewer
  /api/v1/auth/reauth:
    post:
      operationId: reauth
      tags:
        - auth
      summary: Re-authenticate for Tier-3 actions and receive a short-lived token
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-role: operator
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags:
        - tasks
      summary: List tasks
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          required: false
          description: Filter by priority
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Priority"
        - name: agentId
          in: query
          required: false
          description: Filter by assigned agent
          schema:
            type: string
        - name: label
          in: query
          required: false
          description: Filter by label
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Full-text query
          schema:
            type: string
        - name: dueBefore
          in: query
          required: false
          description: Only tasks due before this instant
          schema:
            type: string
            format: date-time
        - name: updatedSince
          in: query
          required: false
          description: Only tasks updated after this instant
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - -updatedAt
              - updatedAt
              - priority
              - dueAt
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.read
      x-required-role: viewer
    post:
      operationId: createTask
      tags:
        - tasks
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Action-Preview-Id
          in: header
          required: false
          description: Exact server draft reference from the first task-create attempt; sending it confirms the unchanged request body.
          schema:
            type: string
            pattern: '^corr_[0-9A-Za-z]{26}$'
        - name: X-Action-Preview-Cancel
          in: header
          required: false
          description: Set to true with X-Action-Preview-Id and the unchanged body to discard that draft without creating a task.
          schema:
            type: string
            enum: ['true']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "204":
          description: Saved preview discarded; no task was created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "201":
          description: Created
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.create
      x-required-role: operator
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags:
        - tasks
      summary: Get a task with steps, tool calls and artifacts
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.read
      x-required-role: viewer
    patch:
      operationId: updateTask
      tags:
        - tasks
      summary: Update a task (also used for Kanban moves)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - name: X-Action-Preview-Id
          in: header
          required: false
          schema: { type: string, pattern: '^corr_[0-9A-Za-z]{26}$' }
        - name: X-Action-Preview-Cancel
          in: header
          required: false
          description: Set to true with the exact preview id and unchanged task update body to discard the draft.
          schema: { type: string, enum: ['true'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "204":
          description: The matching draft was discarded without updating the task.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: tasks.update
      x-required-role: operator
  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags:
        - tasks
      summary: Cancel a task
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Action-Preview-Id
          in: header
          required: false
          schema: { type: string, pattern: '^corr_[0-9A-Za-z]{26}$' }
        - name: X-Action-Preview-Cancel
          in: header
          required: false
          description: Set to true with the exact preview id and unchanged cancellation body to discard the draft.
          schema: { type: string, enum: ['true'] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionRequest"
      responses:
        "200":
          description: Success
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "204":
          description: The matching draft was discarded without cancelling the task.
          headers:

      summary: Stage and confirm one revision-bound native Hermes cron mutation
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Action-Preview-Id
          in: header
          required: false

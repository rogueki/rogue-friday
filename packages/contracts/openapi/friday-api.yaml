  /api/v1/skills/{name}/mutations:
    post:
      operationId: mutateSkill
      tags: [skills]
      summary: Install, update or remove one skill with a snapshot that can be restored
      description: |
        The bridge copies the installed skill directory into ~/.hermes/friday-snapshots before the CLI runs and
        replays the copy when the CLI fails or the read-back does not match. Nothing runs before the request passed
        validation; `identifier` is required for `install` and forbidden for the other actions. `force` is passed
        through as `--force`, which is the only way to overwrite local edits.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillMutationRequest"
      responses:
        "200":
          description: Freshly observed state after the mutation, with the snapshot that allows a manual restore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMutationResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.write
      x-required-role: owner
  /api/v1/skills/governance:
    post:
      operationId: mutateSkillGovernance
      tags: [skills]
      summary: Trust or untrust a project root, or add and remove a tap
      description: |
        Both commands change global Hermes state, so the target is checked in the adapter: a trust target must be an
        absolute directory that really carries `.hermes/skills` or `.agents/skills`, a tap is `owner/repo`, and a tap
        removal names a configured tap. `hermes skills config` is deliberately not exposed - it refuses to run without
        an interactive terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGovernanceRequest"
      responses:
        "200":
          description: The CLI confirmation, unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGovernanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-capability: meta.write
      x-required-role: owner
  /api/v1/skills/reports:
    get:
      operationId: getSkillCommandReport
      tags: [skills]
      summary: Show the text report of a read-only skill command
      description: |
        The CLI offers no JSON for `browse`, `check` and `tap list`, so their text is passed through unchanged and
        capped; nothing is parsed into fields. `browse` accepts page, size and source, `check` accepts one skill name,
        `tap list` accepts nothing - a parameter outside that set is rejected with 422 before the CLI runs.
      parameters:
        - name: command
          in: query
          required: true
          schema:
            type: string
            enum: [browse, check, tap-list]
        - name: name
          in: query
          required: false

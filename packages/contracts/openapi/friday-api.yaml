      responses:
        "200":
          description: Native store mutation accepted; scheduler execution remains unverified
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesCronMutationResponse"

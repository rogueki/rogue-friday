# F.R.I.D.A.Y. Command Center - Adapter-Registry (PLAN 10.9 / 10.10)
# Kopieren nach config/adapters.yaml. Der effektive Betriebsmodus kommt aus dashboard.yaml (dataMode).
#
# Modus-Presets:
#   mock   - jede Kategorie nutzt ihren mock-* Provider (andere Provider werden ignoriert)
#   hybrid - hier genannte Kategorien nutzen ihren Provider, fehlende fallen auf mock-* zurueck
#   live   - fehlende Kategorien sind deaktiviert (nicht gemockt)
#
# Geheimnisse gehoeren NIE als Klartext hierher. Credential-Felder (token, apiKey, password, ...) nutzen
# Referenzen: env:NAME oder wincred:ZIELNAME. ${VAR}/${VAR:-default} ist nur fuer unkritische Werte (URLs).

# Provider-ID -> npm-Paket. Die Registry laedt ausschliesslich Pakete aus dieser Liste.
# Die mock-* Provider (@friday/adapter-mock) sind eingebaut und muessen nicht aufgefuehrt werden.
allowlist: {}
#  hermes-tasks: "@friday/adapter-hermes-placeholder"
#  hermes-activity: "@friday/adapter-hermes-placeholder"
#  gmx-mail: "@friday/adapter-mail-placeholder"
#  caldav-calendar: "@friday/adapter-calendar-placeholder"
#  friday-voice-http: "@friday/adapter-voice-placeholder"
#  windows-wsl-system: "@friday/adapter-system-placeholder"

# Gemeinsame Optionen je Kategorie (alle optional, hier die Standardwerte):
#   enabled: true
#   timeoutMs: 5000
#   retry:           { maxAttempts: 1, baseDelayMs: 200, maxDelayMs: 5000, jitter: 0.2 }   # Registry-Ebene; die Adapter-Clients wiederholen selbst
#   circuitBreaker:  { failureThreshold: 5, resetAfterMs: 30000 }

adapters:
  tasks:
    provider: mock-tasks
    enabled: true
  activity:
    provider: mock-activity
    enabled: true
  memory:
    provider: mock-memory
    enabled: true
  agents:
    provider: mock-agents
    enabled: true
  approvals:
    provider: mock-approvals
    enabled: true
  communication:
    provider: mock-communication
    enabled: true
  calendar:
    provider: mock-calendar
    enabled: true
  automations:
    provider: mock-automations
    enabled: true
  research:
    provider: mock-research
    enabled: true
  files:
    provider: mock-files
    enabled: true
  voice:
    provider: mock-voice
    enabled: true
  notifications:
    provider: mock-notifications
    enabled: true
  system:
    provider: mock-system
    enabled: true
  audit:
    provider: mock-audit
    enabled: true
  commands:
    provider: mock-commands
    enabled: true

# ---------------------------------------------------------------------------------------------
# Vollstaendige Beispiele fuer echte Dienste (Hermes 43693/43691, Voice 43694, lokales System + Qwen 43692):
#   config/adapters.hybrid.example.yaml und config/adapters.live.example.yaml

# F.R.I.D.A.Y. Command Center - Adapter-Registry fuer den HYBRID-Betrieb mit der Installer-Umgebung (PLAN 10.9 / 10.10)
# Kopieren nach config/adapters.yaml und dashboard.hybrid.example.yaml nach config/dashboard.yaml.
#
# Hybrid: Aufgaben, Aktivitaet und Agenten kommen live von Hermes, Sprache vom Voice-Dienst, Systemdaten vom lokalen
# Rechner. Alle anderen Kategorien (Speicher, Freigaben, Kommunikation, Kalender, ...) bleiben mock-* und sind in der
# Oberflaeche als Simulation erkennbar. Aus dem Installer (C:\Jarvis) stammen die Ports und der Hermes-Schluessel:
#   43691 Hermes-Dashboard   43692 Qwen (llama-server)   43693 Hermes-API-Server   43694 Voice-Statusserver
#
# Geheimnisse stehen nie im Klartext in dieser Datei: file:<absoluter Pfad> liest den Schluessel nur serverseitig aus der
# Datei (C:\Jarvis\config\hermes_api.key), env:NAME aus der Umgebung, wincred:ZIEL aus dem Windows-Credential-Manager.
# ${VAR:-Standard} ist nur fuer unkritische Werte wie Pfade und URLs gedacht.

# Provider-ID -> npm-Paket (nur diese Pakete laedt die Registry). Die Ids hermes-* und jarvis-voice-http gibt es auch als
# Platzhalter-Paket (@jarvis/adapter-*-placeholder); zeigt die Allowlist noch auf einen Platzhalter, nimmt die Control API
# trotzdem den echten Adapter und schreibt eine Warnung ins Log.
allowlist:
  hermes-tasks: "@jarvis/adapter-hermes"
  hermes-activity: "@jarvis/adapter-hermes"
  hermes-agents: "@jarvis/adapter-hermes"
  jarvis-voice-http: "@jarvis/adapter-voice-http"
  local-system: "@jarvis/adapter-system-local"

adapters:
  tasks:
    provider: hermes-tasks
    enabled: true
    timeoutMs: 10000
    config:
      dashboardBaseUrl: http://127.0.0.1:43691
      dashboardAuth: scrape # Session-Token aus der Dashboard-Seite (Loopback); alternativ secret | file
      boards: [default]
  activity:
    provider: hermes-activity
    enabled: true
    timeoutMs: 10000
    config:
      apiBaseUrl: http://127.0.0.1:43693
      apiKey: "file:${HERMES_API_KEY_FILE:-C:/Jarvis/config/hermes_api.key}"
      dashboardBaseUrl: http://127.0.0.1:43691
      boards: [default]
  agents:
    provider: hermes-agents
    enabled: true
    timeoutMs: 10000
    config:
      apiBaseUrl: http://127.0.0.1:43693
      apiKey: "file:${HERMES_API_KEY_FILE:-C:/Jarvis/config/hermes_api.key}"
      dashboardBaseUrl: http://127.0.0.1:43691
      boards: [default]
  voice:
    provider: jarvis-voice-http
    enabled: true
    timeoutMs: 3000
    config:
      baseUrl: http://127.0.0.1:43694
      localModelUrl: http://127.0.0.1:43692
      wakePhrase: Hey Friday
  system:
    provider: local-system
    enabled: true
    timeoutMs: 5000
    config:
      qwenUrl: http://127.0.0.1:43692
      hermesApiUrl: http://127.0.0.1:43693
      hermesDashboardUrl: http://127.0.0.1:43691
      voiceUrl: http://127.0.0.1:43694
      hermesApiKey: "file:${HERMES_API_KEY_FILE:-C:/Jarvis/config/hermes_api.key}"
      storagePaths: ["${JARVIS_STORAGE_PATH:-C:/}"]
      wslDistro: Ubuntu

  # Nicht genannte Kategorien (memory, approvals, communication, calendar, automations, research, files, notifications,
  # audit, commands) fallen im Hybrid-Modus auf ihren mock-* Provider zurueck.

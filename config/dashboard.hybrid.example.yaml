# F.R.I.D.A.Y. Command Center - Dashboard-Konfiguration fuer den HYBRID-Betrieb (zusammen mit adapters.hybrid.example.yaml)
# Kopieren nach config/dashboard.yaml. Werte koennen ${ENV_VAR} oder ${ENV_VAR:-default} enthalten.

dataMode: hybrid # in adapters.yaml genannte Kategorien live, der Rest mock

server:
  host: 127.0.0.1
  port: 3100
  allowRemote: false

# Produktiv (PLAN 54): D:\Friday\dashboard\data, ...\logs, ...\backups; relativ zu diesem Config-Verzeichnis.
paths:
  dataDir: ../data
  logDir: ../logs
  backupDir: ../backups
  webRoot: ../apps/web/out

auth:
  mode: local # der Dev-Account ist nur im Mock-Modus erlaubt
  ownerUsername: owner
  # scrypt-Hash: pnpm --filter @friday/auth hash-password ; Verweis env:NAME, file:<absoluter Pfad> oder wincred:ZIEL
  ownerPasswordHash: env:FRIDAY_OWNER_PASSWORD_HASH
  sessionTtlMinutes: 720
  reauthWindowMinutes: 5
  idleTimeoutMinutes: 30
  secureCookies: false

realtime:
  ringBufferSize: 5000
  heartbeatSeconds: 15

ui:
  locale: de-DE
  timezone: Europe/Berlin
  assistantName: F.R.I.D.A.Y.
  theme: friday-command-midnight
  layout: friday-command-overview

dev:
  scenarioConsole: false # die Szenario-Konsole steuert nur Mock-Daten
  responseValidation: true

logging:
  level: info
  redactEmails: false
  file:
    enabled: true
    maxBytes: 10485760
    maxFiles: 5

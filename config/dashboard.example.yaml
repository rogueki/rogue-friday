# JARVIS Command Center - Dashboard-Konfiguration
# Kopieren nach config/dashboard.yaml und anpassen. Werte koennen ${ENV_VAR} oder ${ENV_VAR:-default} enthalten.
# Umgebungsvariablen ueberschreiben diese Datei: JARVIS_DATA_MODE, JARVIS_HOST, JARVIS_PORT,
# JARVIS_DATA_DIR, JARVIS_LOG_DIR, JARVIS_CONFIG_DIR.

# mock   - alles simuliert (Standard, vollstaendig offline lauffaehig)
# hybrid - in adapters.yaml genannte Kategorien live, der Rest mock
# live   - nur konfigurierte Kategorien, nicht konfigurierte sind deaktiviert
dataMode: mock

server:
  host: 127.0.0.1 # nur Loopback; andere Hosts erfordern allowRemote: true
  port: 3100
  allowRemote: false # true nur hinter TLS oder VPN/Zero-Trust (PLAN 49.7), niemals per offener Portfreigabe

# Relative Pfade gelten relativ zu diesem Config-Verzeichnis.
# Produktiv (PLAN 54): D:\Jarvis\dashboard\data, ...\logs, ...\backups
paths:
  dataDir: ../data
  logDir: ../logs
  backupDir: ../backups
  webRoot: ../apps/web/out

auth:
  mode: local # local = Passwort-Login; dev = fester Dev-Account (nur dataMode mock + Loopback)
  ownerUsername: owner
  # Verweis auf den scrypt-Hash, erzeugt mit: pnpm --filter @jarvis/auth hash-password
  # Formate: env:NAME oder wincred:ZIELNAME (Windows Credential Manager, Modul "CredentialManager")
  ownerPasswordHash: env:JARVIS_OWNER_PASSWORD_HASH
  sessionTtlMinutes: 720
  reauthWindowMinutes: 5 # Tier-3-Freigaben brauchen eine Re-Auth innerhalb dieses Fensters
  idleTimeoutMinutes: 30
  secureCookies: false # true, sobald TLS vor der API terminiert

realtime:
  ringBufferSize: 5000
  heartbeatSeconds: 15

ui:
  locale: de-DE
  timezone: Europe/Berlin
  theme: jarvis-command-midnight
  layout: jarvis-command-overview

dev:
  scenarioConsole: true # Standard: true in mock, sonst false
  responseValidation: true # Standard: true in mock/hybrid, false in live

logging:
  level: info
  redactEmails: false # E-Mail-Adressen in Logs maskieren (Datenschutz-Policy)
  file:
    enabled: true
    maxBytes: 10485760
    maxFiles: 5

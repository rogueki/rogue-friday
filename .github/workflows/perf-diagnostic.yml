name: Orb visibility diagnostic

on:
  push:
    branches: [ci/pr24-perf-diag-20261019]

permissions:
  contents: read

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:app
      - run: pnpm exec playwright install --with-deps chromium
      - name: Focused visibility lifecycle with frame/draw diagnostics
        run: pnpm test:e2e --grep "a background tab stops the orb" --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-visibility-diagnostic
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

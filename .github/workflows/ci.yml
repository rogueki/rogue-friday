name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

permissions:
  contents: read

jobs:
  python-helpers:
    name: Python voice and integration helpers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installer/linux/requirements-ci-test.txt

      - name: Install test dependencies
        run: python -m pip install -r installer/linux/requirements-ci-test.txt

      - name: Synthetic voice and integration tests
        env:
          HOME: ${{ runner.temp }}/friday-python-home
        run: |
          mkdir -p "$HOME"
          openssl version
          PYTHONPATH=installer/voice:installer/wsl python -m pytest -q \
            installer/voice/test_audio_devices.py \
            installer/voice/test_memory_outbox.py \
            installer/voice/test_connected_calendar_voice.py \
            installer/voice/tests/test_browser_audio.py \
            installer/voice/tests/test_personal_wake.py \
            installer/voice/tests/test_runtime_settings.py \
            installer/voice/tests/test_mail_voice.py \
            installer/voice/tests/test_mail_voice_pipeline.py \
            installer/voice/tests/test_calendar_voice.py \
            installer/voice/tests/test_headless_compat.py \
            installer/voice/tests/test_voice_runtime_paths.py \
            installer/voice/tests/test_update_dependency_closure.py \
            installer/wsl/test_update_wsl_dependency_closure.py \
            installer/wsl/test_friday_memory_plugin.py \
            installer/wsl/test_mail_accounts.py \
            installer/wsl/test_calendar_accounts.py \
            installer/wsl/test_send_himalaya.py \
            installer/wsl/test_messaging_runtime.py \
            installer/wsl/test_messaging_pairing.py \
            installer/wsl/test_messaging_send.py \
            installer/wsl/test_messaging_catalog.py \
            installer/wsl/test_configure_messaging_provider.py \
            installer/wsl/test_hermes_config_bridge.py \
            installer/wsl/test_hermes_model_credential_apply.py \
            installer/wsl/test_hermes_model_catalog.py \
            installer/wsl/test_hermes_plugin_activation.py \
            installer/wsl/test_hermes_mcp_http_apply.py \
            installer/wsl/test_hermes_mcp_bearer_apply.py \
            installer/wsl/test_hermes_mcp_auth_probe.py \
            installer/wsl/test_hermes_mcp_protocol_probe.py \
            installer/wsl/tests/test_patch_hermes_run_stop.py \
            installer/wsl/test_configure_messenger_inbound_bridge.py \
            installer/wsl/test_messenger_inbound_plugin.py \
            installer/wsl/test_system_backup.py \
            scripts/test_wsl_system_restore.py \
            scripts/test_wsl_recovery_bridge_health.py \
            installer/wsl/tests/test_mail_bridge_setup.py \
            installer/wsl/tests/test_calendar_bridge_setup.py

      - name: Patched pinned Hermes lifecycle integration
        env:
          HOME: ${{ runner.temp }}/friday-hermes-fixture-home
          FRIDAY_HERMES_OFFICIAL_SOURCE: ${{ runner.temp }}/friday-hermes-d923
        run: |
          mkdir -p "$HOME" "$FRIDAY_HERMES_OFFICIAL_SOURCE"
          git -C "$FRIDAY_HERMES_OFFICIAL_SOURCE" init -q
          git -C "$FRIDAY_HERMES_OFFICIAL_SOURCE" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$FRIDAY_HERMES_OFFICIAL_SOURCE" config core.sparseCheckout true
          printf 'hermes_cli/\nplugins/kanban/dashboard/plugin_api.py\ntoolsets.py\nagent/delegation_context.py\ngateway/status.py\nhermes_state*.py\nhermes_constants.py\nutils.py\nhermes_yaml.py\n' > "$FRIDAY_HERMES_OFFICIAL_SOURCE/.git/info/sparse-checkout"
          git -C "$FRIDAY_HERMES_OFFICIAL_SOURCE" fetch --depth 1 origin d923a5eb487a17c0a68801bba9ef0f56c81040a8
          git -C "$FRIDAY_HERMES_OFFICIAL_SOURCE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FRIDAY_HERMES_OFFICIAL_SOURCE" rev-parse HEAD)" = d923a5eb487a17c0a68801bba9ef0f56c81040a8
          python -m pip install fastapi==0.133.1 python-multipart==0.0.20 ruamel.yaml==0.18.16
          python installer/wsl/patch_hermes_run_stop.py "$FRIDAY_HERMES_OFFICIAL_SOURCE"
          python -m unittest -v installer.wsl.tests.test_patch_hermes_official_runtime

  verify:
    name: Contracts, typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PLAN §7.4: OpenAPI/AsyncAPI valid, schemas + examples valid, generated SDK up to date, no breaking change.
      - name: Contracts check
        run: pnpm contracts:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Commit whitespace check
        run: git show --format= --check HEAD

      - name: Unit and component tests
        run: pnpm test

      - name: Adapter conformance
        run: pnpm test:conformance

      - name: Build
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: End-to-end (Playwright ${{ matrix.shard }}/8)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/8 --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
